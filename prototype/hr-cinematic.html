<title>全壘打分鏡原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* PROTOTYPE (throwaway): 全壘打演出分鏡。全螢幕 3D 場景 + 上方分鏡進度 + 下方控制列。單一夜場配色。 */
:root{
  --night:#0e1330;
  --ink:#fff8ec;
  --muted:#b8bfe3;
  --gold:#ffc83d;
  --red:#ff4f3a;
  --panel:rgba(11,15,40,.84);
  --line:rgba(255,255,255,.16);
  --display:'Bungee','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.bar{position:fixed;left:0;right:0;height:0;background:#000;transition:height .35s ease;pointer-events:none;z-index:2}
.bar.top{top:0}.bar.bot{bottom:0}
body.cine .bar{height:8vh}

#speed{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;z-index:1;
  background:repeating-conic-gradient(from 0deg at 50% 45%,transparent 0deg 5deg,rgba(255,255,255,.5) 5deg 5.6deg);
  -webkit-mask:radial-gradient(circle at 50% 45%,transparent 0 28%,#000 62%);mask:radial-gradient(circle at 50% 45%,transparent 0 28%,#000 62%)}
#speed.on{opacity:1;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(6deg)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#flash.on{animation:flash .28s ease-out}
@keyframes flash{from{opacity:.95}to{opacity:0}}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.45);color:var(--muted);border:1px solid var(--line);transition:background .2s,color .2s}
.chip b{font-family:'Bungee',var(--body);font-weight:400;margin-right:3px}
.chip.on{background:var(--gold);color:#1d1400;border-color:var(--gold)}
.chip.done{color:#fff;opacity:.6}
.caption{font-size:13px;line-height:1.45;font-weight:500;max-width:34em;text-shadow:0 1px 3px #000,0 0 8px #000}
.caption .rate{display:inline-block;font-family:'Bungee',var(--body);font-size:11px;padding:1px 5px;margin-right:6px;border-radius:3px;background:var(--red);color:#fff;vertical-align:1px}

#pop{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;
  font-family:var(--display);font-weight:900;font-synthesis:none;font-size:clamp(40px,13vw,96px);line-height:1;color:var(--gold);
  -webkit-text-stroke:3px #2a0d00;paint-order:stroke fill;text-shadow:0 6px 0 #2a0d00,0 10px 24px rgba(0,0,0,.6);opacity:0}
#pop.small{font-size:clamp(30px,9vw,64px);color:#fff}
#pop.show{animation:pop 1.15s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(2.4) rotate(-6deg)}14%{opacity:1;transform:scale(.92) rotate(-3deg)}24%{transform:scale(1.04) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-3deg)}}

#dist{position:fixed;left:0;right:0;top:26%;text-align:center;z-index:6;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
#dist.show{opacity:1;transform:none}
#dist small{display:block;font-size:14px;font-weight:700;letter-spacing:.3em;color:var(--ink);text-shadow:0 2px 6px #000}
#dist b{font-family:'Bungee',var(--body);font-weight:400;font-size:clamp(64px,22vw,150px);color:var(--gold);-webkit-text-stroke:3px #2a0d00;paint-order:stroke fill;text-shadow:0 6px 0 #2a0d00;font-variant-numeric:tabular-nums}
#dist span{font-family:'Bungee',var(--body);font-size:clamp(28px,8vw,54px);color:#fff;-webkit-text-stroke:2px #2a0d00;paint-order:stroke fill;margin-left:4px}

.skip{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--panelH,170px) + 10px);z-index:5;pointer-events:none;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border:1px solid var(--line);padding:5px 9px;border-radius:999px;opacity:0;transition:opacity .2s}
body.cine .skip{opacity:1}
#pitchInfo{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--panelH,170px) + 12px);z-index:5;pointer-events:none;
  display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:8px;background:rgba(8,10,28,.78);border:1px solid var(--line);
  opacity:0;transform:translateY(8px);transition:opacity .15s,transform .15s}
#pitchInfo.show{opacity:1;transform:none}
#pitchInfo .pt{font-size:15px;font-weight:900}
#pitchInfo .ps{font-family:'Bungee',var(--body);font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
#pitchInfo .pu{font-family:'Bungee',var(--body);font-size:12px;color:var(--muted)}
body.cine #pitchInfo{opacity:0}
#introCard{position:fixed;left:0;right:0;top:11%;z-index:6;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s}
#introCard.show{opacity:1}
#introCard .lv{display:inline-block;font-size:14px;font-weight:900;letter-spacing:.3em;padding:3px 12px;border-radius:4px;background:var(--red);color:#fff}
#introCard .nm{display:block;margin-top:8px;font-family:var(--display);font-weight:900;font-synthesis:none;font-size:clamp(34px,11vw,72px);color:#fff;-webkit-text-stroke:3px #2a0d00;paint-order:stroke fill;text-shadow:0 5px 0 #2a0d00}
#introCard .mu{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--gold);text-shadow:0 1px 4px #000}

.panel{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;min-width:3em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{font-size:13px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.opt:focus-visible,.play:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.play{margin-left:auto;font-size:15px;font-weight:900;padding:8px 16px;border-radius:8px;border:0;background:var(--gold);color:#1d1400;box-shadow:0 3px 0 #a87800}
.panel.min > :not(.mini){display:none}
.panel:not(.min) .mini .play{display:none}
.mini .lab{min-width:0;color:var(--ink)}
.play:active{transform:translateY(2px);box-shadow:0 1px 0 #a87800}
.note{font-size:11px;line-height:1.5;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#speed.on{animation:none}#pop.show{animation-duration:.01s;opacity:1}}
</style>

<canvas id="c" aria-label="全壘打演出 3D 畫面"></canvas>
<div class="bar top"></div><div class="bar bot"></div>
<div id="speed"></div><div id="flash"></div>

<header class="hud">
  <div class="chips" id="chips"></div>
  <div class="caption" id="caption">打者背後視角。按「重播」看一次完整的全壘打流程。</div>
</header>
<div id="pop"></div>
<div id="dist"><small>飛距離</small><b id="distN">0</b><span>ft</span></div>
<div id="pitchInfo"><span class="pt" id="piType">直球</span><span class="ps" id="piSpeed">95</span><span class="pu">mph</span></div>
<div id="introCard"><span class="lv" id="icLv">地獄</span><span class="nm" id="icName">山本由伸</span><span class="mu" id="icMu">倍率 ×2.5</span></div>
<div class="skip">點畫面跳過 ▶▶</div>

<section class="panel min" id="panel">
  <div class="row mini"><button class="opt" id="optPanel" aria-expanded="false">選項 ▴</button><span class="lab" id="miniDiff"></span><button class="play" id="play2">▶ 重播</button></div>
  <div class="row"><span class="lab">難度</span><div class="seg" id="diff"></div></div>
  <div class="row"><span class="lab">落點</span><div class="seg" id="tgt"></div></div>
  <div class="row">
    <span class="lab">選項</span>
    <button class="opt" id="optBrk" aria-pressed="true">打碎設施</button>
    <button class="opt" id="optShort" aria-pressed="false">精簡版</button>
    <button class="opt" id="optSlow" aria-pressed="false">慢速 0.5x</button>
    <button class="opt" id="optCams">換一組鏡頭</button>
    <button class="opt" id="optMotion" aria-pressed="false">動作特寫</button>
    <button class="play" id="play">▶ 重播</button>
  </div>
  <div class="note" id="note">原型 v3：選難度會先播投手登場（名字、體型、球衣、特效都是暫定）。球出手時右下角顯示球種與球速。每次重播隨機挑一組鏡頭，按「換一組鏡頭」可以再換。距離改成英尺。<br><b id="combo"></b></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const D = Math.PI / 180;
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeIn = x => x * x;
const easeOut = x => 1 - (1 - x) * (1 - x);
const smooth = x => x * x * (3 - 2 * x);
const rnd = (a, b) => a + Math.random() * (b - a);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- renderer / scene
const renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1500);
const camTop = new THREE.PerspectiveCamera(42, 1, 0.1, 1500), camBot = new THREE.PerspectiveCamera(46, 1, 0.1, 1500);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 64 : 48;
  camera.updateProjectionMatrix();
  document.body.style.setProperty('--panelH', $('#panel').offsetHeight + 'px');
}
addEventListener('resize', resize);

const fmat = c => new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 6 });
const lmat = c => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide });
const polar = (phi, r, y = 0) => new THREE.Vector3(Math.sin(phi * D) * r, y, -Math.cos(phi * D) * r);
const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);

// sky: daytime, like the series' day games
{
  const R = 900, g = new THREE.SphereGeometry(R, 32, 16), p = g.attributes.position, cols = [];
  const top = new THREE.Color('#2f78d8'), mid = new THREE.Color('#6fb0f0'), hor = new THREE.Color('#dcecff');
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / R;
    const c = y > 0.1 ? mid.clone().lerp(top, clamp01((y - 0.1) / 0.6)) : hor.clone().lerp(mid, clamp01((y + 0.02) / 0.12));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  // a few soft clouds
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128; const x = cv.getContext('2d');
  for (let i = 0; i < 9; i++) { const gr = x.createRadialGradient(40 + i * 22, 70 + Math.sin(i) * 14, 0, 40 + i * 22, 70 + Math.sin(i) * 14, 46);
    gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = gr; x.fillRect(0, 0, 256, 128); }
  const ct = new THREE.CanvasTexture(cv);
  for (let i = 0; i < 9; i++) {
    const c = new THREE.Sprite(new THREE.SpriteMaterial({ map: ct, transparent: true, depthWrite: false, fog: false, opacity: 0.85 }));
    c.position.copy(polar(rnd(-80, 80), rnd(380, 600), rnd(110, 230))); c.scale.set(rnd(140, 240), rnd(50, 80), 1); scene.add(c);
  }
}
scene.fog = new THREE.Fog('#dcecff', 260, 900);
scene.add(new THREE.HemisphereLight('#ffffff', '#5c7a3c', 1.0));
const sun = new THREE.DirectionalLight('#fffaf0', 1.35); sun.position.set(-60, 120, 50); scene.add(sun);
sun.castShadow = true; sun.target.position.set(0, 0, -9); scene.add(sun.target);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 16, bottom: -16, near: 10, far: 400 });
sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0006; sun.shadow.radius = 3;

// ---------- field: checkered mowing, reddish infield skin, chalk lines, padded wall with ad boards
const standsY = r => 1 + (r - 123) * 12 / 13;
const FAIR0 = Math.PI * 0.75, FAIRL = Math.PI / 2;   // CylinderGeometry theta range for the fair arc
function adStrip(n, h, seed) {
  // a long canvas of made-up sponsor panels (no real brands)
  const names = ['MOONSHOT', '全壘打可樂', '炸雞24H', 'HR BANK', '手套5折', 'ナイス野球', 'SLUGGER', '月光電機', 'DERBY TV', '本壘保險', 'CURVE CAFE', '球場便當'];
  const pal = [['#1f2a6b', '#ffffff'], ['#d6322b', '#ffffff'], ['#ffc83d', '#1a1a1a'], ['#ffffff', '#1f2a6b'], ['#1f8a5b', '#ffffff'], ['#111111', '#ffc83d'], ['#ff7a1a', '#ffffff']];
  const w = 256, cv = document.createElement('canvas'); cv.width = w * n; cv.height = h; const x = cv.getContext('2d');
  for (let i = 0; i < n; i++) {
    const [bg, fg] = pal[(i * 5 + seed) % pal.length]; x.fillStyle = bg; x.fillRect(i * w, 0, w, h);
    x.fillStyle = fg; x.font = `900 ${Math.round(h * 0.5)}px "Bungee", "Noto Sans TC", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(names[(i * 7 + seed) % names.length], i * w + w / 2, h * 0.54, w - 16);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(i * w, 0, 3, h);
  }
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 8;
  t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1;   // seen from inside the cylinder
  return t;
}
{
  // grass: whole ground, then a checkered fair-territory pattern on top
  const ground = new THREE.Mesh(new THREE.CircleGeometry(700, 48), lmat('#3f8a35'));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const gcv = document.createElement('canvas'); gcv.width = gcv.height = 512; const gx = gcv.getContext('2d');
  for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) { gx.fillStyle = (i + j) % 2 ? '#56a83f' : '#4b9a37'; gx.fillRect(i * 32, j * 32, 32, 32); }
  const gt = new THREE.CanvasTexture(gcv); gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(8, 8);
  const fair = new THREE.Mesh(new THREE.CircleGeometry(120, 64, Math.PI / 4, Math.PI / 2), new THREE.MeshLambertMaterial({ map: gt }));
  fair.rotation.x = -Math.PI / 2; fair.rotation.z = 0; fair.position.y = 0.01; scene.add(fair);
  // warning track
  const track = new THREE.Mesh(new THREE.RingGeometry(114, 120, 64, 1, Math.PI / 4 - 0.02, Math.PI / 2 + 0.04), lmat('#a8623e'));
  track.rotation.x = -Math.PI / 2; track.position.y = 0.02; scene.add(track);
  const lot = new THREE.Mesh(new THREE.RingGeometry(140, 205, 32, 1, Math.PI / 4 - 0.3, Math.PI / 2 + 0.6), lmat('#5d6170'));
  lot.rotation.x = -Math.PI / 2; lot.position.y = 0.02; scene.add(lot);
  // infield skin: the dirt arc behind the bases, infield grass, base cut-outs, home circle, mound
  const SKIN = '#b8643c', SKIN2 = '#a9572f';
  const arc = new THREE.Mesh(new THREE.CircleGeometry(29, 48, Math.PI / 4, Math.PI / 2), lmat(SKIN));
  arc.rotation.x = -Math.PI / 2; arc.position.set(0, 0.03, 0); scene.add(arc);
  const ig = new THREE.Mesh(new THREE.PlaneGeometry(26.4, 26.4), lmat('#56a83f'));
  ig.rotation.x = -Math.PI / 2; ig.rotation.z = Math.PI / 4; ig.position.set(0, 0.04, -19.4); scene.add(ig);
  [[19.4, -19.4], [0, -38.8], [-19.4, -19.4]].forEach(([x, z]) => { const c = new THREE.Mesh(new THREE.CircleGeometry(2.6, 24), lmat(SKIN)); c.rotation.x = -Math.PI / 2; c.position.set(x, 0.05, z); scene.add(c); });
  const homeDirt = new THREE.Mesh(new THREE.CircleGeometry(4.6, 32), lmat(SKIN2));
  homeDirt.rotation.x = -Math.PI / 2; homeDirt.position.set(0, 0.06, 0.4); scene.add(homeDirt);
  const mound = new THREE.Mesh(new THREE.CylinderGeometry(2.7, 2.9, 0.3, 32), lmat(SKIN));
  mound.position.set(0, 0.15, -18.4); scene.add(mound);
  const rubber = box(0.6, 0.04, 0.15, lmat('#ffffff')); rubber.position.set(0, 0.31, -18.4); scene.add(rubber);
  const white = lmat('#ffffff');
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 5), white); plate.rotation.y = Math.PI / 10; plate.position.set(0, 0.08, 0.2); scene.add(plate);
  [[19.4, -19.4], [0, -38.8], [-19.4, -19.4]].forEach(([x, z]) => { const b = box(0.45, 0.1, 0.45, white); b.position.set(x, 0.08, z); scene.add(b); });
  // chalk: foul lines, batter's boxes, catcher's box
  [-45, 45].forEach(phi => {
    const l = box(0.1, 0.02, 120, white); l.position.copy(polar(phi, 60, 0.07)); l.rotation.y = -phi * D; scene.add(l);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 26, 8), lmat('#ffd400')); pole.position.copy(polar(phi, 120.3, 13)); scene.add(pole);
  });
  const chalkBox = (cx, cz, w, d) => [[cx - w / 2, cz, 0.08, d], [cx + w / 2, cz, 0.08, d], [cx, cz - d / 2, w, 0.08], [cx, cz + d / 2, w, 0.08]]
    .forEach(([x, z, bw, bd]) => { const m = box(bw, 0.015, bd, white); m.position.set(x, 0.075, z); scene.add(m); });
  chalkBox(-0.95, 0.2, 1.2, 1.8); chalkBox(0.95, 0.2, 1.2, 1.8); chalkBox(0, 1.9, 1.1, 1.6);
  // padded outfield wall wrapped in ad boards, yellow home-run line on top
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(120, 120, 4, 96, 1, true, FAIR0, FAIRL), new THREE.MeshLambertMaterial({ map: adStrip(48, 64, 1), side: THREE.DoubleSide }));
  wall.position.y = 2; scene.add(wall);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(120.1, 120.1, 0.35, 96, 1, true, FAIR0, FAIRL), lmat('#ffd400'));
  cap.position.y = 4.15; scene.add(cap);
  // stepped stands: 12 rows of blue seats, then a facade with a second ring of ad boards
  for (let i = 0; i < 12; i++) {
    const r0 = 123 + i * 1.08, y0 = standsY(r0);
    const tread = new THREE.Mesh(new THREE.RingGeometry(r0, r0 + 1.08, 72, 1, Math.PI / 4 - 0.12, Math.PI / 2 + 0.24), lmat(i % 2 ? '#2f5fb8' : '#2a55a6'));
    tread.rotation.x = -Math.PI / 2; tread.position.y = y0 + 0.92; scene.add(tread);
    const riser = new THREE.Mesh(new THREE.CylinderGeometry(r0, r0, 0.92, 72, 1, true, FAIR0 - 0.12, FAIRL + 0.24), lmat('#5a6475'));
    riser.position.y = y0 + 0.46; scene.add(riser);
  }
  const facade = new THREE.Mesh(new THREE.CylinderGeometry(136.2, 136.2, 13.5, 72, 1, true, FAIR0 - 0.12, FAIRL + 0.24), lmat('#1d2a4f'));
  facade.position.y = 6.75; scene.add(facade);
  const facadeAds = new THREE.Mesh(new THREE.CylinderGeometry(122.6, 122.6, 1.2, 96, 1, true, FAIR0 - 0.12, FAIRL + 0.24), new THREE.MeshLambertMaterial({ map: adStrip(40, 48, 4), side: THREE.DoubleSide }));
  facadeAds.position.y = 4.9; scene.add(facadeAds);
}

// crowd: little Pawapuro-style fans (body, head, cap or hair, two hands), each one different
const CROWD = [];
const crowdMeshes = {};
const crowdU = { time: { value: 0 }, cheer: { value: 0 } };
{

    const s = shots[cur]; st += sdt * (s.rate || 1);

    if (st >= s.dur) enter(cur + 1);
  } else { setCam(...C0); if (camera.fov !== BATTER_FOV) { camera.fov = BATTER_FOV; camera.updateProjectionMatrix(); } }

  aura.update(sdt);
  if (batFree) {
    batFree.v.y -= 9.8 * sdt; bat.position.addScaledVector(batFree.v, sdt);
    bat.rotation.x += batFree.w.x * sdt; bat.rotation.y += batFree.w.y * sdt; bat.rotation.z += batFree.w.z * sdt;
    if (bat.position.y < 0.06) { bat.position.y = 0.06; batFree.v.set(0, 0, 0); batFree.w.set(0, 0, 0); }
  }

  // ball after impact
  if (ballFree) {
    ballVel.y -= 22 * sdt; ball.position.addScaledVector(ballVel, sdt);
    const r = Math.hypot(ball.position.x, ball.position.z);
    const floor = r > 123 && r < 136 && Math.abs(Math.atan2(ball.position.x, -ball.position.z) / D) < 50 ? standsY(r) : 0;
    if (ball.position.y < floor + 0.13) { ball.position.y = floor + 0.13; ballVel.y = Math.abs(ballVel.y) * 0.45; ballVel.x *= 0.7; ballVel.z *= 0.7; }
  }
  if (ballVisible === 'hand' && cur < 0) pitcher.hands[0].getWorldPosition(ball.position);
  glow.position.copy(ball.position);
  glow.visible = cur >= 0 && shots[cur] && shots[cur].chip >= 1 && shots[cur].chip <= 4;

  // trail
  const flying = glow.visible && (fCur > 0 || ballFree);
  if (flying) { hist.unshift(ball.position.clone()); if (hist.length > 26) hist.pop(); } else hist.length = 0;
  trail.forEach((m, i) => { const p = hist[i * 2 + 1]; m.visible = !!p; if (p) m.position.copy(p); });

  // bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.age += sdt;
    const P = b.pts.geometry.attributes.position;
    b.V.forEach((v, j) => { v.y -= b.g * sdt; v.multiplyScalar(0.985); P.setXYZ(j, P.getX(j) + v.x * sdt, P.getY(j) + v.y * sdt, P.getZ(j) + v.z * sdt); });
    P.needsUpdate = true; b.pts.material.opacity = 1 - b.age / b.life;
    if (b.age >= b.life) { scene.remove(b.pts); b.pts.geometry.dispose(); bursts.splice(i, 1); }
  }
  if (cheer > 0.05 && cur >= 0) { fwTimer -= sdt; if (fwTimer <= 0) { firework(); fwTimer = rnd(0.35, 0.7); } }

  // shards
  shards.forEach(s => {
    if (s.rest) return;
    s.v.y -= 22 * sdt; s.m.position.addScaledVector(s.v, sdt);
    s.m.rotation.x += s.w.x * sdt; s.m.rotation.y += s.w.y * sdt; s.m.rotation.z += s.w.z * sdt;
    const r = Math.hypot(s.m.position.x, s.m.position.z);
    const floor = r > 123 && r < 136 ? standsY(r) : 0;
    if (s.m.position.y < floor + 0.1) { s.m.position.y = floor + 0.1; s.v.y *= -0.3; s.v.x *= 0.5; s.v.z *= 0.5; s.w.multiplyScalar(0.5); if (Math.abs(s.v.y) < 0.6) s.rest = true; }
  });

  // crowd
  crowdU.time.value = clock; crowdU.cheer.value = cheer;
  if (cur < 0) cheer *= Math.exp(-sdt * 0.8);

  if (window.__camOverride) { const o = window.__camOverride; setCam(o[0], o[1], o[2], o[3], o[4], o[5]); crowdU.cheer.value = o[6] || 0; }   // prototype debug hook
  // shake
  if (shakeAmp > 0.001) {
    camera.position.x += rnd(-1, 1) * shakeAmp; camera.position.y += rnd(-1, 1) * shakeAmp;
    shakeAmp *= Math.exp(-dt * 9);
  }
  if (opt.motion && cur >= 0 && shots[cur] && shots[cur].chip === 0) {
    // 動作特寫: split screen — pitcher in profile on top, batter from the front side below
    const w = innerWidth, h = innerHeight, ph = $('#panel').offsetHeight, top = 70, area = h - ph - top, hh = Math.round(area / 2);
    [camTop, camBot].forEach(c => { c.aspect = w / hh; c.updateProjectionMatrix(); });
    camTop.position.set(-3.4, 1.2, -16.6); camTop.lookAt(0, 0.95, -17.75);
    camBot.position.set(2.0, 1.05, -1.7); camBot.lookAt(-0.45, 0.9, 0.25);
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, w, h); renderer.setScissor(0, 0, w, h); renderer.setClearColor('#0e1330'); renderer.clear();
    renderer.setViewport(0, ph + hh, w, area - hh); renderer.setScissor(0, ph + hh, w, area - hh); renderer.render(scene, camTop);
    renderer.setViewport(0, ph, w, hh - 2); renderer.setScissor(0, ph, w, hh - 2); renderer.render(scene, camBot);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h);
  } else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
scene.traverse(o => { if (o.isMesh && o.material && o.material.type === 'MeshLambertMaterial') o.receiveShadow = true; });
useDiff('hell');
poseCrowd(0, 0);
resize(); reset(); setCam(...C0);
requestAnimationFrame(frame);
setTimeout(play, 700);
})();
</script>
